name: autoservice_web
description: "Практическая работа 2. Автосервис: списки, поиск, фильтрация и пагинация."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Маршрутизация через адресную строку
  go_router: ^17.2.3
  # Состояние приложения
  provider: ^6.1.5+1
  # Разделение разрядов и формат дат
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
